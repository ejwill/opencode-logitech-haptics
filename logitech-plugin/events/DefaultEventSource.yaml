displayName: OpenCode Haptics
description: Haptic notifications for OpenCode events

events:
  - name: opencodeComplete
    displayName: OpenCode Complete
    description: OpenCode session completed
  - name: opencodePermission
    displayName: OpenCode Permission
    description: OpenCode needs permission
  - name: opencodeError
    displayName: OpenCode Error
    description: OpenCode encountered an error
  - name: opencodeQuestion
    displayName: OpenCode Question
    description: OpenCode has a question
  - name: opencodePlanExit
    displayName: OpenCode Plan Ready
    description: OpenCode plan is ready for review
  - name: opencodeTest
    displayName: OpenCode Test
    description: Test haptic feedback
