displayName: OpenCode Companion
description: Haptic feedback for OpenCode Companion notifications

events:
  - name: opencodeComplete
    displayName: Turn Complete
    description: OpenCode finished a turn
  - name: opencodePermission
    displayName: Permission Request
    description: OpenCode needs your approval
  - name: opencodeError
    displayName: Turn Error
    description: OpenCode encountered an error
  - name: opencodeQuestion
    displayName: Question Awaiting Answer
    description: OpenCode is waiting for your answer
  - name: opencodePlanExit
    displayName: Plan Ready
    description: OpenCode has a plan ready for review
  - name: opencodeTest
    displayName: Test Haptic Feedback
    description: Confirm that your Logitech device can vibrate
