name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-plugins:
    name: OpenCode plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        run: npm install

      - name: Test OpenCode plugin packages
        run: npm test

      - name: Build npm package
        run: |
          mkdir -p artifacts/npm
          npm pack --workspace opencode-logitech-haptics --pack-destination artifacts/npm
          npm pack --workspace opencode-logitech-haptics-v2 --pack-destination artifacts/npm

      - name: Test installed npm packages
        run: node scripts/verify-packed-adapters.mjs artifacts/npm

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: opencode-plugin-npm-packages
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  logitech-plugin:
    name: Logitech plugin
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: Release
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set package name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            SUFFIX="${GITHUB_REF_NAME#v}"
            SUFFIX="${SUFFIX//./_}"
          else
            REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            SAFE_REF="$(printf '%s' "$REF_NAME" | tr '/.' '_' | tr -cd '[:alnum:]_-')"
            SHORT_SHA="${GITHUB_SHA::7}"
            SUFFIX="${GITHUB_REF_TYPE}_${SAFE_REF}_${SHORT_SHA}"
          fi
          echo "LOGITECH_PACKAGE=OpenCodeHaptics_${SUFFIX}.lplug4" >> "$GITHUB_ENV"

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Build PluginApi test stub
        run: dotnet build tests/PluginApiStubs/PluginApiStubs.csproj -c "$CONFIGURATION"

      - name: Build Logitech plugin
        run: >-
          dotnet build logitech-plugin/OpenCodeHapticsPlugin/OpenCodeHapticsPlugin.sln
          -c "$CONFIGURATION"
          /p:SkipLogiDeploy=true
          /p:PluginApiDir="$GITHUB_WORKSPACE/tests/PluginApiStubs/bin/$CONFIGURATION/net8.0/"

      - name: Smoke test Logitech HTTP bridge
        env:
          PLUGIN_DLL_PATH: ${{ github.workspace }}/logitech-plugin/OpenCodeHapticsPlugin/bin/Release/bin/OpenCodeHapticsPlugin.dll
        run: dotnet run --project tests/ServerSmokeTest/ServerSmokeTest.csproj -c "$CONFIGURATION"

      - name: Pack Logitech plugin
        run: >-
          dotnet tool run logiplugintool pack
          logitech-plugin/OpenCodeHapticsPlugin/bin/$CONFIGURATION/
          "$LOGITECH_PACKAGE"

      - name: Verify Logitech plugin package
        run: dotnet tool run logiplugintool verify "$LOGITECH_PACKAGE"

      - name: Upload Logitech plugin package
        uses: actions/upload-artifact@v7
        with:
          name: logitech-plugin-package
          path: ${{ env.LOGITECH_PACKAGE }}
          if-no-files-found: error

      - name: Upload Logitech plugin build
        uses: actions/upload-artifact@v7
        with:
          name: logitech-plugin-build
          path: logitech-plugin/OpenCodeHapticsPlugin/bin/Release/**
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [opencode-plugins, logitech-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            artifacts/opencode-plugin-npm-packages/*.tgz \
            artifacts/logitech-plugin-package/*.lplug4 \
            --title "$TAG_NAME" \
            --generate-notes
