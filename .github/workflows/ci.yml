name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-plugins:
    name: OpenCode plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        run: npm install

      - name: Test OpenCode plugin packages
        run: npm test

      - name: Build npm package
        run: |
          mkdir -p artifacts/npm
          npm pack --workspace opencode-logi-companion --pack-destination artifacts/npm
          npm pack --workspace opencode-logi-companion-v2 --pack-destination artifacts/npm

      - name: Test installed npm packages
        run: node scripts/verify-packed-adapters.mjs artifacts/npm

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: opencode-plugin-npm-packages
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  logitech-plugin:
    name: Logitech plugin
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: Release
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set package name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            SUFFIX="${GITHUB_REF_NAME#v}"
            SUFFIX="${SUFFIX//./_}"
          else
            REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            SAFE_REF="$(printf '%s' "$REF_NAME" | tr '/.' '_' | tr -cd '[:alnum:]_-')"
            SHORT_SHA="${GITHUB_SHA::7}"
            SUFFIX="${GITHUB_REF_TYPE}_${SAFE_REF}_${SHORT_SHA}"
          fi
          echo "LOGITECH_PACKAGE_BASE=OpenCodeCompanion_${SUFFIX}" >> "$GITHUB_ENV"

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Build PluginApi test stub
        run: dotnet build tests/PluginApiStubs/PluginApiStubs.csproj -c "$CONFIGURATION"

      - name: Build Logitech plugin
        run: >-
          dotnet build logitech-plugin/OpenCodeHapticsPlugin/OpenCodeHapticsPlugin.sln
          -c "$CONFIGURATION"
          /p:SkipLogiDeploy=true
          /p:PluginApiDir="$GITHUB_WORKSPACE/tests/PluginApiStubs/bin/$CONFIGURATION/net10.0/"

      - name: Smoke test Logitech HTTP bridge
        env:
          PLUGIN_DLL_PATH: ${{ github.workspace }}/logitech-plugin/OpenCodeHapticsPlugin/bin/Release/bin/OpenCodeCompanionPlugin.dll
          PLUGIN_API_PATH: ${{ github.workspace }}/tests/PluginApiStubs/bin/Release/net10.0/PluginApi.dll
        run: dotnet run --project tests/ServerSmokeTest/ServerSmokeTest.csproj -c "$CONFIGURATION"

      - name: Pack Logitech plugin for local install and marketplace
        run: >-
          node scripts/package-logitech.mjs
          logitech-plugin/OpenCodeHapticsPlugin/bin/$CONFIGURATION/
          artifacts/logitech/
          "$LOGITECH_PACKAGE_BASE"

      - name: Verify Logitech marketplace ZIP
        run: node scripts/verify-logitech-package.mjs "artifacts/logitech/${LOGITECH_PACKAGE_BASE}_marketplace.lplug4"

      - name: Verify Logitech direct-install tar
        run: node scripts/verify-logitech-package.mjs "artifacts/logitech/${LOGITECH_PACKAGE_BASE}.lplug4"

      - name: Upload Logitech plugin package
        uses: actions/upload-artifact@v7
        with:
          name: logitech-plugin-package
          path: artifacts/logitech/*.lplug4
          if-no-files-found: error

      - name: Upload Logitech plugin build
        uses: actions/upload-artifact@v7
        with:
          name: logitech-plugin-build
          path: logitech-plugin/OpenCodeHapticsPlugin/bin/Release/**
          if-no-files-found: error

  publish-npm:
    name: Publish OpenCode npm packages
    runs-on: ubuntu-latest
    needs: [opencode-plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          name: opencode-plugin-npm-packages
          path: artifacts/npm

      - name: Verify package versions match the release tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          expected="${TAG_VERSION#v}"
          for package in artifacts/npm/*.tgz; do
            actual="$(tar -xOf "$package" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')"
            test "$actual" = "$expected" || { echo "Version mismatch: $package has $actual, expected $expected"; exit 1; }
          done

      - name: Publish packages with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish artifacts/npm/opencode-logi-companion-[0-9]*.tgz --access public --provenance
          npm publish artifacts/npm/opencode-logi-companion-v2-*.tgz --access public --provenance

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [opencode-plugins, logitech-plugin, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            artifacts/opencode-plugin-npm-packages/*.tgz \
            artifacts/logitech-plugin-package/*.lplug4 \
            --title "$TAG_NAME" \
            --generate-notes
